<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="140" fill="#ffffff" opacity="0.06"/>
  <circle cx="120" cy="300" r="110" fill="#ffffff" opacity="0.05"/>

  <!-- progress ring -->
  <g transform="translate(200 160)">
    <circle r="86" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="18"/>
    <circle r="86" fill="none" stroke="url(#ring)" stroke-width="18" stroke-linecap="round"
            stroke-dasharray="443 540" transform="rotate(-90)"/>
    <text y="12" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">82%</text>
    <text y="40" text-anchor="middle" font-size="15" fill="#e0e7ff">attendance</text>
  </g>

  <text x="360" y="150" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1">Attendly</text>
  <text x="364" y="198" font-size="26" fill="#e0e7ff">Your personal, subject‑wise attendance tracker</text>
  <g font-size="17" fill="#ffffff">
    <rect x="364" y="226" width="150" height="36" rx="18" fill="#ffffff" fill-opacity="0.16"/>
    <text x="439" y="250" text-anchor="middle">📊 Live stats</text>
    <rect x="526" y="226" width="170" height="36" rx="18" fill="#ffffff" fill-opacity="0.16"/>
    <text x="611" y="250" text-anchor="middle">🔔 Low alerts</text>
    <rect x="708" y="226" width="190" height="36" rx="18" fill="#ffffff" fill-opacity="0.16"/>
    <text x="803" y="250" text-anchor="middle">📚 Subject‑wise</text>
  </g>
</svg>
